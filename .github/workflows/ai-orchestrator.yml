name: AI Orchestrator

on:
  workflow_dispatch:
    inputs:
      task_type:
        description: Tipo da tarefa
        required: true
        default: fix
        type: choice
        options:
          - feature
          - fix
          - optimize
          - refactor
          - tests
          - docs
      implementer:
        description: Agente que vai alterar o codigo
        required: true
        default: codex
        type: choice
        options:
          - codex
          - gemini
          - claude
      reviewer_1:
        description: Primeiro revisor
        required: true
        default: gemini
        type: choice
        options:
          - gemini
          - codex
          - claude
          - none
      reviewer_2:
        description: Segundo revisor
        required: true
        default: none
        type: choice
        options:
          - none
          - gemini
          - codex
          - claude
      prompt:
        description: Descreva exatamente o que os agentes devem fazer
        required: true
        type: string

permissions: {}

concurrency:
  group: ai-orchestrator-${{ github.repository }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  implement:
    name: Implementar com ${{ inputs.implementer }}
    if: github.actor == 'Daniel-Castro754'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      branch_name: ${{ steps.branch.outputs.branch_name }}
      reused_branch: ${{ steps.branch.outputs.reused_branch }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
      compile_result: ${{ steps.compile.outcome }}
      ruff_result: ${{ steps.ruff.outcome }}
      pytest_result: ${{ steps.pytest.outcome }}
      docker_result: ${{ steps.docker.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar branch idempotente
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME="ai/run-${GITHUB_RUN_ID}"

          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "Branch $BRANCH_NAME ja existe; reutilizando sem chamar o implementador novamente."
            git fetch origin "$BRANCH_NAME:$BRANCH_NAME"
            git checkout "$BRANCH_NAME"
            echo "reused_branch=true" >> "$GITHUB_OUTPUT"
          else
            git checkout -b "$BRANCH_NAME"
            echo "reused_branch=false" >> "$GITHUB_OUTPUT"
          fi

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Validar credencial do implementador
        if: steps.branch.outputs.reused_branch != 'true'
        env:
          SELECTED_PROVIDER: ${{ inputs.implementer }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SELECTED_PROVIDER" in
            codex)
              [ -n "$OPENAI_KEY" ] || { echo 'OPENAI_API_KEY nao configurada.' >&2; exit 1; }
              ;;
            gemini)
              [ -n "$GEMINI_KEY" ] || { echo 'GEMINI_API_KEY nao configurada.' >&2; exit 1; }
              ;;
            claude)
              [ -n "$ANTHROPIC_KEY" ] || { echo 'ANTHROPIC_API_KEY nao configurada.' >&2; exit 1; }
              ;;
            *)
              echo "Provider invalido: $SELECTED_PROVIDER" >&2
              exit 1
              ;;
          esac

      - name: Python 3.11
        if: steps.branch.outputs.reused_branch != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias antes dos agentes
        if: steps.branch.outputs.reused_branch != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Codex - implementar
        id: implement_codex
        if: steps.branch.outputs.reused_branch != 'true' && inputs.implementer == 'codex'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          model: ${{ vars.AI_CODEX_MODEL }}
          prompt: |
            You are the implementation agent for ${{ github.repository }}.

            Read `.ai/rules.yml` and `.ai/prompts/implement.md` first and obey them.

            TASK TYPE: ${{ inputs.task_type }}
            USER REQUEST:
            ${{ inputs.prompt }}

            Work only inside the checked-out repository. Do not commit, push, merge,
            create GitHub issues, or create pull requests. Do not modify anything under
            `.github/**` or `.ai/**`.

            Implement the smallest reliable change that satisfies the request.
            Add or update tests when behavior changes. Dependencies are already installed.
            Do not depend on network access.

            Before finishing, inspect the diff and summarize what changed, tests you ran,
            and any remaining risks or assumptions.

      - name: Gemini - implementar
        id: implement_gemini
        if: steps.branch.outputs.reused_branch != 'true' && inputs.implementer == 'gemini'
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ github.token }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.AI_GEMINI_MODEL }}
          settings: |-
            {
              "model": {
                "maxSessionTurns": 20
              },
              "general": {
                "defaultApprovalMode": "auto_edit"
              },
              "telemetry": {
                "enabled": false
              },
              "tools": {
                "core": [
                  "read_file",
                  "read_many_files",
                  "list_directory",
                  "glob",
                  "grep_search",
                  "write_file",
                  "replace"
                ]
              }
            }
          prompt: |-
            You are the implementation agent for ${{ github.repository }}.

            Read `.ai/rules.yml` and `.ai/prompts/implement.md` first and obey them.

            TASK TYPE: ${{ inputs.task_type }}
            USER REQUEST:
            ${{ inputs.prompt }}

            Work only inside the checked-out repository. Do not commit, push, merge,
            create GitHub issues, or create pull requests. Do not modify anything under
            `.github/**` or `.ai/**`.

            You may edit files only through the provided workspace file tools. Shell and
            network tools are intentionally unavailable. Implement the smallest reliable
            change that satisfies the request and add or update tests when behavior changes.

            Before finishing, inspect your changes and summarize what changed and any
            remaining risks or assumptions.

      - name: Claude - implementar
        id: implement_claude
        if: steps.branch.outputs.reused_branch != 'true' && inputs.implementer == 'claude'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the implementation agent for ${{ github.repository }}.

            Read `.ai/rules.yml` and `.ai/prompts/implement.md` first and obey them.

            TASK TYPE: ${{ inputs.task_type }}
            USER REQUEST:
            ${{ inputs.prompt }}

            Work only inside the checked-out repository. Do not commit, push, merge,
            create GitHub issues, or create pull requests. Do not modify anything under
            `.github/**` or `.ai/**`.

            Implement the smallest reliable change that satisfies the request and add or
            update tests when behavior changes. Do not use network access or Git commands.
          claude_args: ${{ vars.AI_CLAUDE_MODEL != '' && format('--max-turns 20 --model {0} --allowedTools Edit,Read,Write,Glob,Grep', vars.AI_CLAUDE_MODEL) || '--max-turns 20 --allowedTools Edit,Read,Write,Glob,Grep' }}
          settings: |-
            {
              "permissions": {
                "allow": ["Read", "Glob", "Grep", "Edit", "Write"],
                "deny": ["Bash", "WebFetch", "WebSearch"]
              }
            }

      - name: Verificar escopo e caminhos protegidos
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.branch.outputs.reused_branch }}" = "true" ]; then
            CHANGED_FILES="$(git diff --name-only origin/main...HEAD | sort -u)"
          else
            CHANGED_FILES="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          fi

          echo "Arquivos alterados:"
          printf '%s\n' "$CHANGED_FILES"

          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "O implementador nao produziu alteracoes de arquivos." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(\.github/|\.ai/)'; then
            echo 'ERRO: o agente alterou um caminho protegido (.github ou .ai).' >&2
            exit 1
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Validar sintaxe
        id: compile
        if: steps.changes.outputs.has_changes == 'true' && steps.branch.outputs.reused_branch != 'true'
        continue-on-error: true
        run: python -m compileall -q app

      - name: Ruff - erros criticos
        id: ruff
        if: steps.changes.outputs.has_changes == 'true' && steps.branch.outputs.reused_branch != 'true'
        continue-on-error: true
        run: ruff check app tests --select E9,F63,F7,F82

      - name: Pytest
        id: pytest
        if: steps.changes.outputs.has_changes == 'true' && steps.branch.outputs.reused_branch != 'true'
        continue-on-error: true
        run: python -m pytest -q

      - name: Docker build
        id: docker
        if: steps.changes.outputs.has_changes == 'true' && steps.branch.outputs.reused_branch != 'true'
        continue-on-error: true
        run: docker build -t br-stremio-addon .

      - name: Commit e push da branch AI
        if: steps.changes.outputs.has_changes == 'true' && steps.branch.outputs.reused_branch != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
          IMPLEMENTER: ${{ inputs.implementer }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "ai: ${{ inputs.task_type }} via ${IMPLEMENTER}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Registrar reutilizacao sem custo de modelo
        if: steps.branch.outputs.reused_branch == 'true'
        run: |
          echo "A branch remota desta execucao ja existia." >> "$GITHUB_STEP_SUMMARY"
          echo "O implementador nao foi chamado novamente; nenhum token de implementacao foi consumido neste retry." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publicar ou reutilizar draft PR
    needs: implement
    if: needs.implement.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_url: ${{ steps.pr.outputs.pr_url }}

    steps:
      - name: Criar ou reutilizar draft pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ needs.implement.outputs.branch_name }}
          REUSED_BRANCH: ${{ needs.implement.outputs.reused_branch }}
          USER_PROMPT: ${{ inputs.prompt }}
          IMPLEMENTER: ${{ inputs.implementer }}
          REVIEWER_1: ${{ inputs.reviewer_1 }}
          REVIEWER_2: ${{ inputs.reviewer_2 }}
          COMPILE_RESULT: ${{ needs.implement.outputs.compile_result }}
          RUFF_RESULT: ${{ needs.implement.outputs.ruff_result }}
          PYTEST_RESULT: ${{ needs.implement.outputs.pytest_result }}
          DOCKER_RESULT: ${{ needs.implement.outputs.docker_result }}
        shell: bash
        run: |
          set -euo pipefail

          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number // empty')"

          if [ -n "$PR_NUMBER" ]; then
            PR_URL="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
            echo "PR #${PR_NUMBER} ja existe; reutilizando." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## AI Orchestrator run'
              echo
              echo "**Task type:** \`${{ inputs.task_type }}\`"
              echo "**Implementer:** \`${IMPLEMENTER}\`"
              echo "**Reviewer 1:** \`${REVIEWER_1}\`"
              echo "**Reviewer 2:** \`${REVIEWER_2}\`"
              echo "**Triggered by:** \`${GITHUB_ACTOR}\`"
              echo "**Workflow run:** \`${GITHUB_RUN_ID}\`"
              echo
              echo '### Prompt'
              printf '%s\n' "$USER_PROMPT"
              echo
              echo '### Validation'
              if [ "$REUSED_BRANCH" = "true" ]; then
                echo '- Branch reused from an earlier successful implementation stage of this same workflow run.'
                echo '- The model implementation step was not called again during this retry.'
              else
                echo "- compileall: ${COMPILE_RESULT}"
                echo "- Ruff critical checks: ${RUFF_RESULT}"
                echo "- Pytest: ${PYTEST_RESULT}"
                echo "- Docker build: ${DOCKER_RESULT}"
              fi
              echo
              echo '> This PR is intentionally a draft. AI reviewers cannot merge it; final approval stays human.'
            } > /tmp/ai-pr-body.md

            PR_URL="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --base main \
              --head "$BRANCH_NAME" \
              --title "AI: ${{ inputs.task_type }} via ${IMPLEMENTER} (run ${GITHUB_RUN_ID})" \
              --body-file /tmp/ai-pr-body.md)"

            PR_NUMBER="$(gh pr view "$PR_URL" --repo "$GITHUB_REPOSITORY" --json number --jq '.number')"
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Draft PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"

  review:
    name: Revisar ${{ matrix.slot }}
    needs:
      - implement
      - publish
    if: needs.publish.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        slot:
          - reviewer_1
          - reviewer_2
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      SELECTED_REVIEWER: ${{ matrix.slot == 'reviewer_1' && inputs.reviewer_1 || inputs.reviewer_2 }}
      PR_NUMBER: ${{ needs.publish.outputs.pr_number }}
      BRANCH_NAME: ${{ needs.implement.outputs.branch_name }}

    steps:
      - name: Registrar slot sem revisor
        if: env.SELECTED_REVIEWER == 'none'
        run: echo "${{ matrix.slot }} desativado." >> "$GITHUB_STEP_SUMMARY"

      - name: Validar credencial do revisor
        if: env.SELECTED_REVIEWER != 'none'
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SELECTED_REVIEWER" in
            codex)
              [ -n "$OPENAI_KEY" ] || { echo 'OPENAI_API_KEY nao configurada.' >&2; exit 1; }
              ;;
            gemini)
              [ -n "$GEMINI_KEY" ] || { echo 'GEMINI_API_KEY nao configurada.' >&2; exit 1; }
              ;;
            claude)
              [ -n "$ANTHROPIC_KEY" ] || { echo 'ANTHROPIC_API_KEY nao configurada.' >&2; exit 1; }
              ;;
          esac

      - name: Verificar se este commit ja foi revisado neste slot
        id: dedupe
        if: env.SELECTED_REVIEWER != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT: ${{ matrix.slot }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          MARKER="<!-- ai-review:${HEAD_SHA}:${SLOT}:${SELECTED_REVIEWER} -->"
          EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n 1 || true)"

          if [ -n "$EXISTING" ]; then
            echo "already_done=true" >> "$GITHUB_OUTPUT"
            echo "Review ja existe para ${SELECTED_REVIEWER}/${SLOT} no commit ${HEAD_SHA}; modelo nao sera chamado novamente." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "already_done=false" >> "$GITHUB_OUTPUT"
          fi

          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "marker=$MARKER" >> "$GITHUB_OUTPUT"

      - name: Checkout branch AI
        if: env.SELECTED_REVIEWER != 'none' && steps.dedupe.outputs.already_done != 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.implement.outputs.branch_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar contexto de review
        if: env.SELECTED_REVIEWER != 'none' && steps.dedupe.outputs.already_done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Pull request metadata'
            gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json number,title,body,baseRefName,headRefName,files
            echo
            echo '# Pull request diff'
            gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          } > AI_REVIEW_CONTEXT.md

      - name: Codex - review read-only
        id: review_codex
        if: env.SELECTED_REVIEWER == 'codex' && steps.dedupe.outputs.already_done != 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':read-only'
          model: ${{ vars.AI_CODEX_MODEL }}
          prompt: |
            Read `.ai/prompts/review.md` and `AI_REVIEW_CONTEXT.md`.

            Review only the change described by the PR context. Do not modify files,
            commit, push, merge, or use network access. Focus on correctness,
            regressions, security/privacy, compatibility, missing tests, edge cases,
            performance regressions, and unnecessary complexity.

            Classify meaningful findings as critical/high/medium/low. If there are no
            meaningful findings, say so explicitly. Return only the review text.

      - name: Publicar review do Codex
        if: env.SELECTED_REVIEWER == 'codex' && steps.dedupe.outputs.already_done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_TEXT: ${{ steps.review_codex.outputs.final-message }}
          SLOT: ${{ matrix.slot }}
          MARKER: ${{ steps.dedupe.outputs.marker }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "$MARKER"
            echo "## Codex review (${SLOT})"
            echo
            printf '%s\n' "$REVIEW_TEXT"
          } > /tmp/review-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/review-comment.md

      - name: Gemini - review read-only
        id: review_gemini
        if: env.SELECTED_REVIEWER == 'gemini' && steps.dedupe.outputs.already_done != 'true'
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ github.token }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.AI_GEMINI_MODEL }}
          settings: |-
            {
              "model": {
                "maxSessionTurns": 12
              },
              "telemetry": {
                "enabled": false
              },
              "tools": {
                "core": [
                  "read_file",
                  "read_many_files",
                  "list_directory",
                  "glob",
                  "grep_search"
                ]
              }
            }
          prompt: |-
            Read `.ai/prompts/review.md` and `AI_REVIEW_CONTEXT.md`.

            Review only the change described by the PR context. This is strictly
            READ-ONLY. Do not modify files, commit, push, merge, or use shell/network
            tools. Focus on bugs, edge cases, regressions, test gaps, security/privacy,
            compatibility, and performance.

            Classify meaningful findings as critical/high/medium/low. If there are no
            meaningful findings, say so explicitly. Return only the review text.

      - name: Publicar review do Gemini
        if: env.SELECTED_REVIEWER == 'gemini' && steps.dedupe.outputs.already_done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_TEXT: ${{ steps.review_gemini.outputs.summary }}
          SLOT: ${{ matrix.slot }}
          MARKER: ${{ steps.dedupe.outputs.marker }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "$MARKER"
            echo "## Gemini review (${SLOT})"
            echo
            printf '%s\n' "$REVIEW_TEXT"
          } > /tmp/review-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/review-comment.md

      - name: Claude - review read-only
        if: env.SELECTED_REVIEWER == 'claude' && steps.dedupe.outputs.already_done != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read `.ai/prompts/review.md` and `AI_REVIEW_CONTEXT.md`.

            Review only the change described by the PR context. This is READ-ONLY.
            Do not edit files, commit, push, merge, change branches, or change PR state.

            Focus on correctness, regressions, security/privacy, compatibility, missing
            tests, edge cases, performance, and unnecessary complexity. Classify findings
            as critical/high/medium/low. If no meaningful issues are found, say so.

            Post exactly one top-level comment to PR #${{ needs.publish.outputs.pr_number }}
            using `gh pr comment`. The FIRST line of the comment must be exactly:
            `${{ steps.dedupe.outputs.marker }}`
            The second line must be `## Claude review (${{ matrix.slot }})`.
          claude_args: ${{ vars.AI_CLAUDE_MODEL != '' && format('--max-turns 10 --model {0}', vars.AI_CLAUDE_MODEL) || '--max-turns 10' }}
          settings: |-
            {
              "permissions": {
                "allow": ["Read", "Glob", "Grep", "Bash(gh pr comment:*)"],
                "deny": ["Write", "Edit", "WebFetch", "WebSearch", "Bash(git:*)"]
              }
            }

      - name: Remover contexto temporario
        if: always() && env.SELECTED_REVIEWER != 'none' && steps.dedupe.outputs.already_done != 'true'
        run: rm -f AI_REVIEW_CONTEXT.md

  review_gate:
    name: Human review gate
    needs:
      - publish
      - review
    if: always() && needs.publish.outputs.pr_number != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Registrar status final sem duplicar comentario
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.publish.outputs.pr_number }}
          IMPLEMENTER: ${{ inputs.implementer }}
          REVIEWER_1: ${{ inputs.reviewer_1 }}
          REVIEWER_2: ${{ inputs.reviewer_2 }}
          REVIEW_RESULT: ${{ needs.review.result }}
        shell: bash
        run: |
          set -euo pipefail
          MARKER="<!-- ai-orchestration-status:${GITHUB_RUN_ID} -->"
          EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n 1 || true)"

          if [ -n "$EXISTING" ]; then
            echo "Status final ja publicado para este workflow run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "${MARKER}
          ## AI orchestration status

          - Implementer: **${IMPLEMENTER}**
          - Reviewer 1: **${REVIEWER_1}**
          - Reviewer 2: **${REVIEWER_2}**
          - Review jobs: **${REVIEW_RESULT}**

          The pull request remains a **draft**. No AI agent is authorized to merge to \`main\`."
